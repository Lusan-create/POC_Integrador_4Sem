components:
  schemas:
    AcaoEnum:
      enum:
      - login
      - login_falha
      - acesso_negado
      - criar
      - editar
      - excluir
      - inativar
      - reativar
      - movimentar
      - abrir_os
      - atualizar_os
      type: string
      description: |-
        * `login` - Login
        * `login_falha` - Falha de login
        * `acesso_negado` - Acesso negado
        * `criar` - Criação
        * `editar` - Edição
        * `excluir` - Exclusão
        * `inativar` - Inativação
        * `reativar` - Reativação
        * `movimentar` - Movimentação
        * `abrir_os` - Abertura de OS
        * `atualizar_os` - Atualização de OS
    Ativo:
      type: object
      description: Leitura com os dados relacionados já resolvidos; escrita pelos
        IDs.
      properties:
        id:
          type: integer
          readOnly: true
        identificacao:
          type: string
          title: Patrimônio
          maxLength: 30
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
          maxLength: 255
        categoria:
          allOf:
          - $ref: '#/components/schemas/Categoria'
          readOnly: true
        localizacao:
          allOf:
          - $ref: '#/components/schemas/Localizacao'
          readOnly: true
        responsavel:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumo'
          readOnly: true
        status:
          $ref: '#/components/schemas/AtivoStatusEnum'
        status_exibicao:
          type: string
          readOnly: true
        ultima_manutencao:
          type: string
          format: date
          readOnly: true
          nullable: true
        proxima_manutencao:
          type: string
          format: date
          nullable: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizado_em
      - categoria
      - criado_em
      - id
      - identificacao
      - localizacao
      - nome
      - responsavel
      - status_exibicao
      - ultima_manutencao
    AtivoRequest:
      type: object
      description: Leitura com os dados relacionados já resolvidos; escrita pelos
        IDs.
      properties:
        identificacao:
          type: string
          minLength: 1
          title: Patrimônio
          maxLength: 30
        nome:
          type: string
          minLength: 1
          maxLength: 120
        descricao:
          type: string
          maxLength: 255
        categoria_id:
          type: integer
          writeOnly: true
        localizacao_id:
          type: integer
          writeOnly: true
        responsavel_id:
          type: integer
          writeOnly: true
          nullable: true
        status:
          $ref: '#/components/schemas/AtivoStatusEnum'
        proxima_manutencao:
          type: string
          format: date
          nullable: true
      required:
      - categoria_id
      - identificacao
      - localizacao_id
      - nome
    AtivoResumo:
      type: object
      properties:
        id:
          type: integer
        identificacao:
          type: string
        nome:
          type: string
      required:
      - id
      - identificacao
      - nome
    AtivoStatusEnum:
      enum:
      - disponivel
      - em_uso
      - em_manutencao
      - inativo
      type: string
      description: |-
        * `disponivel` - Disponível
        * `em_uso` - Em uso
        * `em_manutencao` - Em manutenção
        * `inativo` - Inativo
    CargoEnum:
      enum:
      - admin
      - user
      type: string
      description: |-
        * `admin` - Administrador
        * `user` - Usuário
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 80
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - id
      - nome
    CategoriaRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - nome
    Localizacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 80
        descricao:
          type: string
          nullable: true
          maxLength: 255
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - id
      - nome
    LocalizacaoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 80
        descricao:
          type: string
          nullable: true
          maxLength: 255
      required:
      - nome
    LogAuditoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
          nullable: true
        usuario_email:
          type: string
          maxLength: 255
        acao:
          $ref: '#/components/schemas/AcaoEnum'
        acao_exibicao:
          type: string
          readOnly: true
        entidade:
          type: string
          maxLength: 40
        entidade_id:
          type: string
          maxLength: 40
        descricao:
          type: string
          maxLength: 500
        detalhes: {}
        ip:
          type: string
          nullable: true
        criado_em:
          type: string
          format: date-time
      required:
      - acao
      - acao_exibicao
      - id
    LoginRequest:
      type: object
      description: Login por e-mail e senha; devolve os tokens JWT e os dados do usuário.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Manutencao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ativo:
          allOf:
          - $ref: '#/components/schemas/AtivoResumo'
          readOnly: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        tipo_exibicao:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ManutencaoStatusEnum'
        status_exibicao:
          type: string
          readOnly: true
        descricao:
          type: string
          nullable: true
          maxLength: 500
        aberta_em:
          type: string
          format: date-time
          readOnly: true
        realizada_em:
          type: string
          format: date
          nullable: true
        proxima_prevista:
          type: string
          format: date
          nullable: true
        custo:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        registrado_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumo'
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - aberta_em
      - ativo
      - criado_em
      - id
      - registrado_por
      - status_exibicao
      - tipo_exibicao
    ManutencaoRequest:
      type: object
      properties:
        ativo_id:
          type: integer
          writeOnly: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        status:
          $ref: '#/components/schemas/ManutencaoStatusEnum'
        descricao:
          type: string
          nullable: true
          maxLength: 500
        realizada_em:
          type: string
          format: date
          nullable: true
        proxima_prevista:
          type: string
          format: date
          nullable: true
        custo:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - ativo_id
    ManutencaoStatusEnum:
      enum:
      - aberta
      - em_andamento
      - concluida
      - cancelada
      type: string
      description: |-
        * `aberta` - Aberta
        * `em_andamento` - Em andamento
        * `concluida` - Concluída
        * `cancelada` - Cancelada
    Movimentacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ativo:
          allOf:
          - $ref: '#/components/schemas/AtivoResumo'
          readOnly: true
        origem:
          allOf:
          - $ref: '#/components/schemas/Localizacao'
          readOnly: true
        destino:
          allOf:
          - $ref: '#/components/schemas/Localizacao'
          readOnly: true
        observacao:
          type: string
          maxLength: 500
        registrado_por:
          allOf:
          - $ref: '#/components/schemas/UsuarioResumo'
          readOnly: true
        realizada_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - ativo
      - destino
      - id
      - origem
      - realizada_em
      - registrado_por
    MovimentacaoRequest:
      type: object
      properties:
        ativo_id:
          type: integer
          writeOnly: true
        destino_id:
          type: integer
          writeOnly: true
        observacao:
          type: string
          maxLength: 500
