            schema:
              $ref: '#/components/schemas/PatchedAtivoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtivoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtivoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ativo'
          description: ''
    delete:
      operationId: ativos_destroy
      description: RF02, RF04, RF05, RF06 — cadastro, consulta, edição e inativação
        de ativos.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este ativo.
        required: true
      tags:
      - ativos
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ativos/{id}/historico/:
