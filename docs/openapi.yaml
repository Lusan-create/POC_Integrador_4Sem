  /api/manutencoes/:
    get:
      operationId: manutencoes_list
      description: RF08 — abertura e acompanhamento de ordens de serviço. Exclusão
        só para admin.
      parameters:
      - in: query
        name: ativo
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - aberta
          - cancelada
          - concluida
          - em_andamento
        description: |-
          * `aberta` - Aberta
          * `em_andamento` - Em andamento
          * `concluida` - Concluída
          * `cancelada` - Cancelada
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Valores múltiplos podem ser separados por vírgulas.
        explode: false
        style: form
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - corretiva
          - preventiva
        description: |-
          * `corretiva` - Corretiva
          * `preventiva` - Preventiva
      tags:
      - manutencoes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManutencaoList'
          description: ''
    post:
      operationId: manutencoes_create
      description: RF08 — abertura e acompanhamento de ordens de serviço. Exclusão
        só para admin.
      tags:
      - manutencoes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManutencaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManutencaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManutencaoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manutencao'
          description: ''
