openapi: 3.0.3
info:
  title: API — Sistema de Gestão de Ativos
  version: 1.0.0
  description: Contrato da API REST consumida pela aplicação web (Vue) e pelo aplicativo
    mobile (Flutter). Autentique em /api/auth/login/ e use o token no botão Authorize
    (Bearer).
paths:
  /api/ativos/:
    get:
      operationId: ativos_list
      description: RF02, RF04, RF05, RF06 — cadastro, consulta, edição e inativação
        de ativos.
      parameters:
      - in: query
        name: categoria
        schema:
          type: integer
      - in: query
        name: localizacao
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: responsavel
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - disponivel
          - em_manutencao
          - em_uso
          - inativo
        description: |-
          * `disponivel` - Disponível
          * `em_uso` - Em uso
          * `em_manutencao` - Em manutenção
          * `inativo` - Inativo
      tags:
      - ativos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAtivoList'
          description: ''
    post:
      operationId: ativos_create
      description: RF02, RF04, RF05, RF06 — cadastro, consulta, edição e inativação
        de ativos.
      tags:
      - ativos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtivoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AtivoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AtivoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ativo'
          description: ''
  /api/ativos/{id}/:
    get:
      operationId: ativos_retrieve
      description: RF02, RF04, RF05, RF06 — cadastro, consulta, edição e inativação
        de ativos.
      parameters:
      - in: path
        name: id
