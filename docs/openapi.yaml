      description: RF02, RF04, RF05, RF06 — cadastro, consulta, edição e inativação
        de ativos.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este ativo.
        required: true
      tags:
      - ativos
      requestBody:
        content:
