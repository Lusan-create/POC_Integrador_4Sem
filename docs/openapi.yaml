  /api/logs/:
    get:
      operationId: logs_list
      description: Consulta dos logs (RS04) — somente administradores; logs não podem
        ser alterados.
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          enum:
          - abrir_os
          - acesso_negado
          - atualizar_os
          - criar
          - editar
          - excluir
          - inativar
          - login
          - login_falha
          - movimentar
          - reativar
        description: |-
          * `login` - Login
          * `login_falha` - Falha de login
          * `acesso_negado` - Acesso negado
          * `criar` - Criação
          * `editar` - Edição
          * `excluir` - Exclusão
          * `inativar` - Inativação
          * `reativar` - Reativação
          * `movimentar` - Movimentação
          * `abrir_os` - Abertura de OS
          * `atualizar_os` - Atualização de OS
      - in: query
        name: entidade
        schema:
          type: string
      - in: query
        name: entidade_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: usuario
        schema:
          type: integer
      tags:
      - logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogAuditoriaList'
          description: ''
  /api/logs/{id}/:
    get:
      operationId: logs_retrieve
      description: Consulta dos logs (RS04) — somente administradores; logs não podem
        ser alterados.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este log de auditoria.
        required: true
